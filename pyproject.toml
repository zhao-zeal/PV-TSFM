[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-tsfm"
version = "0.1.0"
description = "Auditable power-only PV transfer forecasting experiments"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyyaml"]

[project.optional-dependencies]
training = [
  "torch>=2.2,<3",
  "chronos-forecasting==2.2.2",
  "peft==0.17.1",
  "transformers>=4.41,<5",
  "accelerate>=0.34,<2",
]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
